#cloud-config
# Any Ubuntu 24.04 aarch64 VM. Today: Azure for Students, Standard_B2pls_v2 (Ampere, 2 vCPU / 4 GB), passed as
#   az vm create ... --custom-data <your filled-in copy>      (docs/OPS.md §6 has the full command)
# Works unchanged on Oracle's Ampere A1 too: paste it as the "cloud-init script" (Advanced options).
#
# Replace the three __PLACEHOLDERS__ first, in a copy that is never committed (e.g. under ops/state/). That's the only editing:
#   __SSH_PUBLIC_KEY__     your laptop's public key (az also takes one with --ssh-key-values; they can be the same)
#   __DEPLOY_KEY__         a READ-ONLY GitHub deploy key for the private repo (ssh-keygen -t ed25519 -f susq_deploy)
#                          (or delete that write_files entry and set SUSQ_GIT_TOKEN in runcmd instead)
#   __REPO_URL__           git@github.com:KarthikSubramanian07/Susquatch.git
#
# Custom data stays readable on the VM (Azure keeps a root-only copy in /var/lib/waagent/ovf-env.xml; Oracle's metadata service
# serves it to any process), which is why only a read-only deploy key goes here. Real secrets go into
# /opt/susquatch/.env over SSH afterwards.
#
# Boot -> ~10 min for packages -> ~15 min for the first native image builds. Then:
#   ssh ubuntu@<ip>; sudo -u ubuntu nano /opt/susquatch/.env; sudo systemctl restart susquatch
#   (or /opt/susquatch/ops/restore.sh to come back from the latest backup in the B2 bucket)

package_update: true
package_upgrade: true
package_reboot_if_required: false
timezone: Etc/UTC

users:
  - default
  - name: ubuntu
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

ssh_pwauth: false

write_files:
  - path: /root/.ssh/susq_deploy_key
    permissions: "0600"
    owner: root:root
    content: |
      __DEPLOY_KEY__

runcmd:
  - [bash, -c, "mkdir -p /opt && ssh-keyscan -t ed25519 github.com >> /root/.ssh/known_hosts"]
  - - bash
    - -c
    - >-
      GIT_SSH_COMMAND='ssh -i /root/.ssh/susq_deploy_key'
      git clone --branch main __REPO_URL__ /opt/susquatch
      && SUSQ_HOME=/opt/susquatch SUSQ_USER=ubuntu SUSQ_REPO_URL=__REPO_URL__
      /opt/susquatch/ops/install.sh 2>&1 | tee /var/log/susquatch-install.log

final_message: "Susquatch cloud-init finished after $UPTIME s. See /var/log/susquatch-install.log"
