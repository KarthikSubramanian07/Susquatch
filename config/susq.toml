# Susquatch shared configuration — read by the Python bridge/scheduler AND rust-live.
# Non-secret only. Secrets come from .env / the environment (see .env.example).
# Every value here is a default; experiments change them via PRs logged in experiments/.

[platform]
base_url = "https://www.thesuper.market/api/v1"
alt_base_url = "https://sig.thesuper.market/api/v1"
tournament_slug = "midterm-elections"
request_timeout_ms = 10000
# Published budget since 2026-10-01: ONE budget per account, shared by every key and every process:
# 100 reads + 30 writes a minute (2.17 req/s). A 429 carries Retry-After: 60, so staying under it matters
# more than speed. While the bridge and a rust-live paper run share the account, each gets half; raise
# max_rps to 2.0 once only one trader runs. The limiter still adapts down on 429 / Retry-After.
initial_rps = 1.0
min_rps = 0.25
max_rps = 1.0
# Share of the request budget reserved for order placement/cancel (never starved by reads): 30/130.
order_budget_frac = 0.23

[calendar]
# 2026-10-01 12:00 EDT and 2026-11-04 12:00 EST, in UTC.
open_utc = "2026-10-01T16:00:00Z"
lock_utc = "2026-11-04T17:00:00Z"
# Hard gate: no new orders at/after this; cancel-all fires here; every order's expiration <= this.
last_order_utc = "2026-11-04T16:55:00Z"

[mode]
# paper | live. Live ALSO requires SUSQ_MODE=live in the environment and ops/GO_LIVE containing "go live".
default = "paper"

[risk]
per_market_gross_frac = 0.05
# Gross = positions at mark + resting orders. The sniper filled 72% with near-certain outcomes before it got
# its own 35% budget (it never sells), so 0.90 is what leaves ~15% for the far quoter's cheap resting
# ladders. The Oct 2 review decides how the sniper book is trimmed to fund the scenario book from Oct 7.
total_gross_frac = 0.90
glitch_through_fair_pts = 15.0     # an order this far through fair is a "glitch trade"...
glitch_max_frac = 0.02             # ...and is capped at this share of capital
loss_per_hour_frac = 0.03          # MTM loss in any rolling hour that trips cancel-all + freeze
reject_breaker_per_min = 10
max_order_notional_frac = 0.02     # default per-order cap unless a strategy sets tighter
# ALL collateral ("relationship-backed buying power"): when true, cash-affordability checks and racer
# sizing count an order's modeled EFFECTIVE cost (nominal minus the advance its relationship
# component's guaranteed payout floor would back, i.e. netBuyingPowerImpact) instead of its full
# notional. "auto" (Karthik's call, 2026-09-30): off until measure_day1's collateral section
# confirms the live engine matches the model, then on by itself, recorded in
# state/bridge/collateral_confirmed.json; a later measured mismatch switches it back off.
# true / false force it either way. Exposure caps above always use full notional; `all`
# economics are journaled regardless.
use_collateral_buying_power = "auto"

[risk.clusters]
# Gross exposure (cost of positions plus resting orders) per correlated cluster, as a fraction of equity.
# Every race carries "national", so this is the cap on everything. 25% starved the sniper from the first
# evening of the Cup (every order rejected "cap: cluster:national" once fills reached 27k at cost), while the
# positions are near-certain outcomes bought 3.5+ points through a two-reference fair: a national wave moves
# their value by far less than their cost. Set equal to total_gross, which is the binding cap.
national = 0.90
region = 0.40
state = 0.10
house = 0.20

[oms]
default_ttl_s = 300                # every order carries expirationDate = now + ttl (capped at last_order_utc)
reconcile_interval_s = 15
idempotency_namespace = "6f1c0e2a-7c55-4d7e-9a8e-5f2b3c1d0a99"   # uuid5 namespace for deterministic keys

[lease]
path = "ops/state/trader.lease"
ttl_s = 30
renew_s = 5

[kill]
file = "ops/KILL"
go_live_file = "ops/GO_LIVE"

[fair]
kalshi_weight = 0.8
sim_weight = 0.2
stale_after_s = 60                 # orders built on older fair values are cancelled
mapping_error_pts = 25.0           # |cup_mid - fair| beyond this = assume mis-mapping, block + flag

[live]
# Per-market realtime topics rust-live joins (Supabase caps channels per connection); the rest is polled.
realtime_market_channels = 80
# /healthz calls the loop stuck after this many seconds without a completed step; a step's serial REST reads
# at ~1 req/s can take tens of seconds.
max_step_age_s = 120

[strategies.racer]
enabled = true
poll_interval_s = 3.0              # fallback when realtime is down; realtime is primary
min_edge = 0.01                    # guaranteed-payoff margin after ticks, per bundle share
max_bundle_notional_frac = 0.01
order_ttl_s = 20
refire_cooldown_s = 30             # never re-fire on the same relationship within this window
max_relationship_notional_frac = 0.03  # cap on notional already held across a relationship's legs

[strategies.sniper]
enabled = true
min_edge_pts = 3.5                 # through fair, after ticks
max_mistake_frac = 0.01            # size so a wrong fill costs < 1% of bankroll
max_total_gross_frac = 0.35        # stop adding once positions + resting orders reach 35% of equity
order_ttl_s = 30

[strategies.farquote]
# Passive far quotes (bridge): on every verified market with fair <= max_fair rest BUY NO at these NO prices
# (selling YES at 0.90-0.99); on markets with fair >= 1 - max_fair rest BUY YES at them. Day one's leaders were
# paid by accounts dumping whole balances at those prices. A fill is a ~0.99 share for a few cents; the cost of
# resting is reserved cash, capped per market and in total.
enabled = true
max_fair = 0.05
levels = [0.01, 0.03, 0.05, 0.10]
reserve_frac = 0.15
max_market_frac = 0.02
order_ttl_s = 86400               # capped at last_order_utc by the gateway
interval_s = 600                  # top-up cadence: 30 writes/min is the whole account's budget

[strategies.mm]
enabled = false                    # decided by the decision table after measure_day1

[strategies.scenario]
enabled = true
tranche_frac = 0.25                # fraction of the remaining gap to target worked per tranche
start_utc = "2026-10-07T16:00:00Z" # no scenario tranche before this (book is bought from week two)
min_interval_s = 900               # at least 15 min between tranches on the same exchange
max_hourly_notional_frac = 0.02    # stop once the trailing hour's tranches exceed 2% of equity

[telemetry]
leaderboard_interval_s = 3600
price_snapshot_interval_s = 60

[targets]
dir = "targets"
max_age_h = 36                     # tightened in the final days

[optimizer]
# Scenario book (SPEC §3 Phase 2): the daily targets run spends this share of equity on the book.
book_frac = 0.60                   # full size: 50-70% of capital in the scenario book
early_book_frac = 0.30             # smaller size while the book is bought gradually (from Oct 7)
early_until_utc = "2026-10-21T16:00:00Z"   # full size from here (Oct 21 12:00 EDT)
max_legs = 12                      # most legs in one scenario book
max_leg_frac = 0.12                # most equity in any single leg

[needle]
heartbeat_timeout_s = 10
resume_after_healthy = 5

[paths]
journal = "journal"
state = "state"
data = "data"
reports = "reports"
status = "state/status.json"
market_map = "state/market_map.json"

[ops]
# Status push to the dashboard (Cloudflare KV free tier = 1,000 writes/day, shared with kill + summary).
status_push_interval_s = 150
status_push_interval_election_s = 120
status_push_daily_budget = 800
status_stale_after_s = 300          # status.json older than this = its writer is hung
kill_poll_interval_s = 10
# Election-night CPU priority window: Nov 3 18:00 ET -> Nov 4 12:00 ET (EST, after the Nov 1 DST change).
priority_window_start_utc = "2026-11-03T23:00:00Z"
priority_window_end_utc = "2026-11-04T17:00:00Z"
# Backups (Backblaze B2 free tier: 10 GB, no card; the r2_* names predate the move from R2). Uploads refuse at guard_frac of the quota.
backup_max_age_h = 30
r2_quota_bytes = 10_000_000_000
r2_guard_frac = 0.80
backup_keep_daily = 7
backup_keep_weekly = 4
