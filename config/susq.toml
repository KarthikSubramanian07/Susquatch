# Susquatch shared configuration — read by the Python bridge/scheduler AND rust-live.
# Non-secret only. Secrets come from .env / the environment (see .env.example).
# Every value here is a default; experiments change them via PRs logged in experiments/.

[platform]
base_url = "https://www.thesuper.market/api/v1"
alt_base_url = "https://sig.thesuper.market/api/v1"
tournament_slug = "midterm-elections"
request_timeout_ms = 10000
# Published budget since 2026-10-01: ONE budget per account, shared by every key and every process:
# 100 reads + 30 writes a minute (2.17 req/s). A 429 carries Retry-After: 60, so staying under it matters
# more than speed. While the bridge and a rust-live paper run share the account, each gets half; raise
# max_rps to 2.0 once only one trader runs. The limiter still adapts down on 429 / Retry-After.
initial_rps = 1.0
min_rps = 0.25
max_rps = 1.0
# Share of the request budget reserved for order placement/cancel (never starved by reads): 30/130.
order_budget_frac = 0.23

[calendar]
# 2026-10-01 12:00 EDT and 2026-11-04 12:00 EST, in UTC.
open_utc = "2026-10-01T16:00:00Z"
lock_utc = "2026-11-04T17:00:00Z"
# Hard gate: no new orders at/after this; cancel-all fires here; every order's expiration <= this.
last_order_utc = "2026-11-04T16:55:00Z"

[mode]
# paper | live. Live ALSO requires SUSQ_MODE=live in the environment and ops/GO_LIVE containing "go live".
default = "paper"

[risk]
per_market_gross_frac = 0.05
# Gross = positions at mark + resting orders. The sniper filled 72% with near-certain outcomes before it got
# its own 35% budget (it never sold before the EXP-003 unwind), so 0.90 is what leaves ~15% for the far quoter's cheap resting
# ladders. The Oct 2 review decides how the sniper book is trimmed to fund the scenario book from Oct 7.
total_gross_frac = 0.90
glitch_through_fair_pts = 15.0     # an order this far through fair is a "glitch trade"...
glitch_max_frac = 0.02             # ...and is capped at this share of capital (needle-derived election-night
                                   # orders use [strategies.en] en_glitch_pts instead of 15 pts; same cap)
loss_per_hour_frac = 0.03          # MTM loss in any rolling hour that trips cancel-all + freeze
reject_breaker_per_min = 10
max_order_notional_frac = 0.02     # default per-order cap unless a strategy sets tighter
# ALL collateral ("relationship-backed buying power"): when true, cash-affordability checks and racer
# sizing count an order's modeled EFFECTIVE cost (nominal minus the advance its relationship
# component's guaranteed payout floor would back, i.e. netBuyingPowerImpact) instead of its full
# notional. "auto" (Karthik's call, 2026-09-30): off until measure_day1's collateral section
# confirms the live engine matches the model, then on by itself, recorded in
# state/bridge/collateral_confirmed.json; a later measured mismatch switches it back off.
# true / false force it either way. Exposure caps above always use full notional; `all`
# economics are journaled regardless.
use_collateral_buying_power = "auto"

[risk.clusters]
# Gross exposure (cost of positions plus resting orders) per correlated cluster, as a fraction of equity.
# Every race carries "national", so this is the cap on everything. 25% starved the sniper from the first
# evening of the Cup (every order rejected "cap: cluster:national" once fills reached 27k at cost), while the
# positions are near-certain outcomes bought 3.5+ points through a two-reference fair: a national wave moves
# their value by far less than their cost. Set equal to total_gross, which is the binding cap.
national = 0.90
region = 0.40
# 0.10 was full of sniper positions in RI, NH and FL by Oct 2 evening, so the far quoter's cheap ladders there
# were rejected thousands of times a day. The sniper never adds past its own 35% budget, so 0.20 only opens
# room for the ladders (a few hundred SUSQies of reserved cash per market).
state = 0.20
house = 0.20

[oms]
default_ttl_s = 300                # every order carries expirationDate = now + ttl (capped at last_order_utc)
reconcile_interval_s = 15
idempotency_namespace = "6f1c0e2a-7c55-4d7e-9a8e-5f2b3c1d0a99"   # uuid5 namespace for deterministic keys

[lease]
path = "ops/state/trader.lease"
ttl_s = 30
renew_s = 5

[kill]
file = "ops/KILL"
go_live_file = "ops/GO_LIVE"

[fair]
kalshi_weight = 0.8
sim_weight = 0.2
stale_after_s = 60                 # orders built on older fair values are cancelled
mapping_error_pts = 25.0           # |cup_mid - fair| beyond this = assume mis-mapping, block + flag

[live]
# Per-market realtime topics rust-live joins (Supabase caps channels per connection); the rest is polled.
realtime_market_channels = 80
# /healthz calls the loop stuck after this many seconds without a completed step; a step's serial REST reads
# at ~1 req/s can take tens of seconds.
max_step_age_s = 120
# Time a step may spend on throttled order-book reads before it moves on (the rest wait for later steps);
# paper mode gets the same again for re-reading the books under resting paper orders.
book_refresh_budget_ms = 3000

[strategies.racer]
enabled = true
poll_interval_s = 3.0              # fallback when realtime is down; realtime is primary
min_edge = 0.01                    # guaranteed-payoff margin after ticks, per bundle share
max_bundle_notional_frac = 0.01
order_ttl_s = 20
refire_cooldown_s = 30             # never re-fire on the same relationship within this window
max_relationship_notional_frac = 0.03  # cap on notional already held across a relationship's legs

[strategies.sniper]
enabled = true
min_edge_pts = 3.5                 # through fair, after ticks
max_mistake_frac = 0.01            # size so a wrong fill costs < 1% of bankroll
max_total_gross_frac = 0.35        # stop adding once positions + resting orders reach 35% of equity
order_ttl_s = 30
# EXP-003 (approved 2026-10-07): from unwind_from_utc the sniper stops buying and sells what it holds to free
# cash for the 60% scenario book and the election-night budget. The unwind set is every held side whose fair
# is >= 0.90 on a verified market with a fresh, sane fair, that is not a locked targets leg and has no other
# strategy's order resting on it. Each sell is priced at max(bid, fair - unwind_max_haircut_pts) rounded up to
# the tick (never below that floor), is at most the holding and max_mistake_frac of equity, and the unwind
# stops once cash reaches unwind_target_cash_frac of equity or this hour's sells reach unwind_max_hourly_frac.
# These values equal the defaults in both traders (bridge SniperConfig, Rust SniperCfg).
unwind_from_utc = "2026-10-24T16:00:00Z"   # Oct 24 12:00 EDT
unwind_max_haircut_pts = 2.0
unwind_target_cash_frac = 0.60
unwind_max_hourly_frac = 0.10      # proceeds of unwind sells sent in any trailing hour, as a share of equity

[strategies.farquote]
# Passive far quotes (bridge): on every verified market with fair <= max_fair rest BUY NO at these NO prices
# (selling YES at 0.90-0.99); on markets with fair >= 1 - max_fair rest BUY YES at them. Day one's leaders were
# paid by accounts dumping whole balances at those prices. A fill is a ~0.99 share for a few cents; the cost of
# resting is reserved cash, capped per market and in total.
enabled = true
max_fair = 0.05
levels = [0.01, 0.03, 0.05, 0.10]
reserve_frac = 0.08                # EXP-002: 0.15 left ~13.5k free cash against a 31k early scenario book
max_market_frac = 0.02
order_ttl_s = 86400               # capped at last_order_utc by the gateway
interval_s = 600                  # top-up cadence: 30 writes/min is the whole account's budget

[strategies.mm]
enabled = false                    # decided by the decision table after measure_day1

[strategies.scenario]
# Read by both traders: the bridge (live account, EXP-008) and rust-live. Tranches are also clamped to [risk] max_order_notional_frac.
enabled = true
tranche_frac = 0.25                # fraction of the remaining gap to target worked per tranche
start_utc = "2026-10-11T16:00:00Z" # EXP-007: held until the tape-fitted threshold (was Oct 7); book bought gradually after
min_interval_s = 900               # at least 15 min between tranches on the same exchange
max_hourly_notional_frac = 0.02    # stop once the trailing hour's tranches exceed 2% of equity

[strategies.en]
# Election-night executor (rust-live only; the Python bridge has no election-night code). It trades race
# markets on the needle's posteriors: buys a side when the posterior beats the ask by the threshold below,
# and "rolls" (sells) a held side once its bid is within roll_within_pts of the posterior. It acts only while
# the needle watchdog is healthy; a silent or invalid needle cancels every needle-derived order
# (docs/ELECTION_NIGHT.md, docs/RUNBOOK.md §2). The values here equal the Rust defaults (EnCfg) on purpose.
# OFF until the night: at the Nov 3 17:00 ET pre-flight flip the next line to `enabled = true` (nothing else).
enabled = false
min_edge_pts = 8.0                 # buy only when posterior − ask ≥ this many points ...
se_mult = 3.0                      # ... and ≥ this many model standard errors (see se_margin_err_pts below)
roll_within_pts = 2.0              # sell a held side once its bid is within this many points of the posterior
require_corroboration = true       # a buy needs ≥ 2 county batches or a same-direction real-money fair move
max_order_frac = 0.02              # notional per order as a share of equity (also bounded by [risk])
order_ttl_s = 20                   # buys and rolls are re-decided every tick; nothing rests for long
# Glitch cap for needle-derived orders: an order this many points through its own posterior counts as a
# glitch trade (cumulative cap [risk] glitch_max_frac). The general 15 pts would cap the best post-batch
# buys, which are 15+ point edges by design; 40 pts still catches an inverted map or a broken posterior.
en_glitch_pts = 40.0
# With --election, rust-live reads the results pollers' health (crates/enr EnrHealth): a race whose mapped
# sources (config/enr_sources.toml [[races]] / contests) have all had no successful poll for this long, failed
# three polls in a row, or never polled, gets no new buys (rolls of held legs still happen). A race whose
# sources disagree beyond [consistency] is disputed: the executor refuses it and cancels its resting orders.
feed_stale_s = 180
# ── Model SE and the night budget (readiness audit gaps #11 and #10) ──────────────────────────────────────
# The model standard error behind se_mult comes from the posterior's own margin uncertainty: with margin_mean m
# and margin_sd s (points), SE(q) = phi(m / s) × se_margin_err_pts / s, the delta-method move in the win
# probability for a model error of se_margin_err_pts points in the margin. A toss-up with a tight sd is
# fragile (large SE, no buy); a race called by many sd is not. 0 keeps the old batch-count proxy
# sqrt(q(1−q)/(1+n_batches)), which is also the fallback for a posterior without margin_sd.
se_margin_err_pts = 1.0
# Share of equity the executor may have deployed in needle-derived orders at any time across the night
# (buys at their limit, filled or resting, net of what rolls sold back). Enforced by risk: a buy that would
# push past it is refused like any other cap. Cash for it has to be free at 19:00 ET (the EXP-003 sniper unwind
# from Oct 24 frees it; this knob only makes the budget explicit).
night_budget_frac = 0.25
# ── Count-order playbook (EXP-006, config/count_order.toml, docs/ELECTION_NIGHT.md §7) ─────────────────────
# The needle's margin already projects the uncounted vote, so the table is NOT subtracted from it: it is a
# direction check and a band. A buy that agrees with the registered direction of the count still to come
# needs the threshold above; a buy against it (or in a race with no registered direction) needs the threshold
# plus the band converted to probability through the posterior's margin and sd. Rolls are never gated.
count_order_enabled = true
count_order_path = "config/count_order.toml"
# Lock-time rule: the contest pays on the final count, not the lock. From lock_window_start, a race counted
# below lock_max_reported_frac whose registered lock drift is at least lock_min_drift_pts (band smaller than
# the drift: CA, CA House seats, NV, PA) may be bought on the side the remaining count favours, at the normal
# threshold, on the needle's last posterior for it even after posterior_max_age_s, while the needle is healthy
# and that posterior is no older than lock_posterior_max_age_s. Sized like any other buy (night budget, caps).
lock_rule_enabled = true
lock_window_start = "2026-11-04T14:00:00Z"
lock_max_reported_frac = 0.85
lock_min_drift_pts = 1.5
lock_posterior_max_age_s = 10800
# Leader/contender switch: at equity / 100,000 >= this multiple, open no new positions and only roll.
# 0 = off: the field maximum on the night is not observed, so there is no honest multiple to switch at.
contender_hedge_multiple = 0.0
# ── Contender mode: the concentrated night profile (EXP-014, experiments/EXP-014-concentrated-night.md) ─────
# OFF. Arming it is a separate, explicit decision at the Nov 3 pre-flight, after rehearsal #2. While false, every
# contender_* key below is inert and the executor behaves exactly as above. While true:
# - the night budget is contender_budget_frac instead of night_budget_frac;
# - held legs are NOT rolled at roll_within_pts: a leg is sold once its bid is at least contender_exit_bid, or
#   once the needle has called the race (model SE at or below contender_call_se), at no less than its posterior
#   minus min_edge_pts; buys still clear min_edge_pts and se_mult, ranked across races by edge × depth;
# - a needle-derived buy may build its market (and that market's state/house cluster) up to contender_market_frac
#   of equity, but only while the book holds at least contender_min_depth SUSQies within
#   contender_depth_window_pts of the touch on the side taken, measured at order time (5% everywhere else);
# - the loss-per-hour breaker trips at contender_loss_per_hour_frac instead of [risk] loss_per_hour_frac.
# Kill switch, needle watchdog, stale-feed and dispute gates, glitch cap, corroboration and max_order_frac stay.
contender_mode = false
contender_budget_frac = 0.80
contender_exit_bid = 0.93
contender_call_se = 0.005
contender_market_frac = 0.30
contender_min_depth = 100000.0
contender_depth_window_pts = 3.0
contender_loss_per_hour_frac = 0.50

[telemetry]
leaderboard_interval_s = 3600
price_snapshot_interval_s = 60
# Trade tape (data/cup/tape): the field's actual fills per market. Budget math against the shared
# 100 reads/min: a pass walks each exchange newest-first and stops at the first trade already on
# disk, so steady state is one read per exchange (about 240) every 30 min, ~8 reads/min. The cap
# bounds a backlog (the first pass pages history since Oct 1): 600 requests per 1800 s pass is at
# most 20 reads/min, a fifth of the budget, and the limiter paces them at max_rps anyway. 0 disables.
tape_interval_s = 1800
tape_max_requests_per_pass = 600

[targets]
dir = "targets"
max_age_h = 36                     # tightened in the final days

[optimizer]
# Scenario book (SPEC §3 Phase 2): the daily targets run spends this share of equity on the book.
# EXP-013: sized to what the [risk] caps let the account hold (was 0.60; the caps refused every scenario
# order from Oct 19 to 25 and the book reached 14% of target), and a smaller book keeps election night open.
book_frac = 0.15
early_book_frac = 0.20             # EXP-002: sized to free cash (was 0.30); bought gradually from Oct 7
early_until_utc = "2026-10-21T16:00:00Z"   # full size from here (Oct 21 12:00 EDT)
max_legs = 12                      # most legs in one scenario book
max_leg_frac = 0.05                # most equity in any single leg; EXP-013: = [risk] per_market_gross_frac (was 0.12)
# EXP-009 scenario hysteresis: keep the current targets' scenario unless a challenger's score (closeness
# while every score is 0) beats it by more than this fraction, or the incumbent is top under no field
# assumption. The executor never reduces dropped legs, so every flip orphans a book and spends cash twice.
switch_margin = 0.25
# EXP-011 endgame rival model (draft, not applied): w > 0 scores scenarios against (1 - w) * T + w * R, where
# R is the best resolved multiple among the modeled top rivals (state/research/rivals_book.json, written by
# `susq research rivals --book-out`). Keep at 0.0 until EXP-011 is approved; 0.0 leaves targets unchanged.
rival_decorrelation = 0.0

[optimizer.concentrate]
# EXP-012 concentrated longshot book (draft, off). The targets run searches single YES legs (ask <= max_ask)
# and equal-cost pairs, spending each share of equity in `fracs`, for the highest unconditional P(1st)
# against a per-world bar: "targets" (the run's T), "rivals" (EXP-011's best modeled rival, floored at the
# leaderboard anchor) or "max". mode = "report" only writes the best book into the targets notes; "commit"
# replaces the scenario book when it beats it by min_gain, and is only useful with [risk]
# per_market_gross_frac and the cluster caps raised for that leg (at 0.05 the trader stops at 5% of equity).
mode = "report"
threshold = "targets"
max_ask = 0.10
fracs = [0.9, 1.0]
min_gain = 0.005

[needle]
# Liveness: no healthy needle message (heartbeat or posterior) for this long = unhealthy. The watchdog then
# cancels every needle-derived order and clears the posteriors; it trusts the needle again after this many
# healthy messages in a row.
heartbeat_timeout_s = 10
resume_after_healthy = 5
# Posteriors are published only after an accepted county batch (CA regenerates about every 5 min, GA caches
# 60 s), so a posterior stays tradeable for this long while the heartbeat keeps the needle healthy. Must be
# at least heartbeat_timeout_s; a silent needle still clears everything at heartbeat_timeout_s.
posterior_max_age_s = 600

[paths]
journal = "journal"
state = "state"
data = "data"
reports = "reports"
status = "state/status.json"
market_map = "state/market_map.json"

[ops]
# Status push to the dashboard (Cloudflare KV free tier = 1,000 writes/day, shared with kill + summary).
status_push_interval_s = 150
status_push_interval_election_s = 120
status_push_daily_budget = 800
status_stale_after_s = 300          # status.json older than this = its writer is hung
kill_poll_interval_s = 10
# Election-night CPU priority window: Nov 3 18:00 ET -> Nov 4 12:00 ET (EST, after the Nov 1 DST change).
priority_window_start_utc = "2026-11-03T23:00:00Z"
priority_window_end_utc = "2026-11-04T17:00:00Z"
# Backups (Backblaze B2 free tier: 10 GB, no card; the r2_* names predate the move from R2). Uploads refuse at guard_frac of the quota.
backup_max_age_h = 30
r2_quota_bytes = 10_000_000_000
r2_guard_frac = 0.80
# The archives are small since the incremental files tree (ops/backup.sh); the bulk is stored once.
backup_keep_daily = 2
backup_keep_weekly = 1
