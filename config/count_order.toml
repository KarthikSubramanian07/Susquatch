# Pre-registered count-order playbook for election night (EXP-006), Nov 3 to 4 2026.
#
# Read by rust-live (crates/core/src/count_order.rs, used by the election-night executor
# crates/strategies/src/en_executor.rs) and by the replay drill (py/susq/replay/count_order.py).
# Registered 2026-10-06 from the two research memos (gitignored, reports/research/):
#   count-order-and-detector-2026-10-06.md   (15 states plus the "Lock-time drift summary, all 18 states")
#   count-order-IA-GA-WI-2026-10-06.md       (Iowa, Georgia, Wisconsin)
# Do not tune these numbers on the night: the point of the table is that it was written down first.
#
# Convention (the memos'): drift = (reported D minus R margin at the hour) minus (final D minus R margin),
# in points. Negative drift means the partial count is more Republican than the final, so the count still
# to come favours the Democrat. Hours are after `poll_close_utc` (the memos' hour zero, the state's last
# general poll close; for MI, NH, TX and KS the memos count from 8 pm ET, for NE from 9 pm ET, for AK
# from midnight ET, and those are the instants written here, each equal to one of the closings in
# config/poll_closing.toml). The lock is Nov 4 2026 12:00 ET = 17:00Z, so `lock_h` is the hours from
# poll close to 17:00Z.
#
# Points: `h1`, `h3`, `h6`, `h12` and `lock`. `h1` carries the FIRST-HOUR value (the first batches,
# 0 to 1 h after close), because that is how the memos report the opening mirage. Between points the
# executor interpolates linearly; before `h1` it holds the `h1` value; after `lock` it goes linearly to
# zero at `final_h` (when the count is essentially complete) and is zero after. Before poll close
# nothing is registered. The linear segment from h1 to h3 overstates the mirage where the crossover is
# fast (NC, OH, NE flip within about 90 minutes); the bands are wide there.
#
# Bands (points) were set by one rule, written down before any replay:
#   band = half the range spanned by the memos' numbers at that hour (both cycles, or the stated range)
#          + an estimate allowance: 0.5 pt where the memo marks the number "est.", 1.0 pt for an
#          est. first-hour value of 5 pts or more, 0.25 pt for an "about" print; 0 for a sourced print.
# Where the memos give a range the drift is its midpoint; where they say "no direction" the drift is 0
# and the band carries the size. A drift has a registered DIRECTION only when |drift| > band; the
# executor then needs only its normal threshold for a buy that agrees with the count still to come and
# the threshold plus the band (converted to probability through the posterior's margin and sd) for a
# buy against it. With no direction every buy pays the band.
#
# Race-level overrides: `[states.XX.races."<pattern>"]`, keyed by a race id pattern (`*` matches any
# run of characters; the longest literal pattern wins). An override replaces `drift_pts` and
# `band_pts` for matching races; everything else comes from the state.

[meta]
lock_utc = "2026-11-04T17:00:00Z"
registered = "2026-10-06"
election_date = "2026-11-03"

