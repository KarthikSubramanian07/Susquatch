[states.CA]
name = "California"
poll_close_utc = "2026-11-04T04:00:00Z"   # 8:00 pm PT
lock_h = 13.0
final_h = 312.0                           # AB 5: most ballots counted within 13 days
share_counted_at_lock = "50 to 60%"
report_first = ["mail received before Election Day", "election day in person", "late mail and Election Day drop-offs", "conditional registrations and provisionals"]
# h1: first mail batch +5.6 (2022) / +2 to +5 est. (2024): mid 3.8, band 1.8 + 0.5.
# h3: -0.5 to -1.5 est. (2022) / -1 to -2 est. (2024): mid -1.25, band 0.75 + 0.5.
# h6, h12: the Wednesday-morning print covers +6 to +13: -3.2 / -2.9, mid -3.05, band 0.15 + 0.5.
# lock: pre-registered -3 (observed -3.2 and -2.9), band 0.15 + 0.5 (share counted is est.).
drift_pts = { h1 = 3.8, h3 = -1.25, h6 = -3.05, h12 = -3.05, lock = -3.0 }
band_pts = { h1 = 2.3, h3 = 1.25, h6 = 0.65, h12 = 0.65, lock = 0.65 }
notes = "Largest lock-time bias on the board: the lock print is reliably about 3 pts more R than final statewide, with only 50 to 60% counted. AB 5 speeds the tail, not the Wednesday-morning count. Governor race is top-two and open."
source = "count-order-and-detector-2026-10-06.md: California; Lock-time drift summary (CA)"

